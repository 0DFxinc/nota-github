name: Attested Vercel preview and Nota gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: 0DFxinc/nota-github/.github/workflows/deploy-vercel-and-attest.yml@72bd6d81192a5dc527212deeb26c9930065e36d6
    with:
      policy-id: 00000000-0000-4000-8000-000000000000
      nota-environment: development
      github-environment: nota-ci

  nota:
    needs: deploy
    uses: 0DFxinc/nota-github/.github/workflows/run.yml@72bd6d81192a5dc527212deeb26c9930065e36d6
    with:
      policy-id: 00000000-0000-4000-8000-000000000000
      nota-environment: development
      github-environment: nota-ci
