name: Attested Vercel preview and Nota gate

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: 0DFxinc/nota-github/.github/workflows/deploy-vercel-and-attest.yml@ef9ea95296f04b5c91cd54c084d678a39eb9c0ef
    with:
      policy-id: 00000000-0000-4000-8000-000000000000
      nota-environment: development
      github-environment: nota-ci

  nota:
    needs: deploy
    uses: 0DFxinc/nota-github/.github/workflows/run.yml@ef9ea95296f04b5c91cd54c084d678a39eb9c0ef
    with:
      policy-id: 00000000-0000-4000-8000-000000000000
      nota-environment: development
      github-environment: nota-ci
