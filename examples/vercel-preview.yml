name: Attested Vercel preview and Nota gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: 0DFxinc/nota-github/.github/workflows/deploy-vercel-and-attest.yml@5d77b34ec276a4a0c15820c341f788d81aef5bf1
    with:
      policy-id: 00000000-0000-4000-8000-000000000000
      nota-environment: development
      github-environment: nota-ci

  nota:
    needs: deploy
    uses: 0DFxinc/nota-github/.github/workflows/run.yml@5d77b34ec276a4a0c15820c341f788d81aef5bf1
    with:
      policy-id: 00000000-0000-4000-8000-000000000000
      nota-environment: development
      github-environment: nota-ci
